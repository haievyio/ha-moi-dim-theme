# «Мій дім» — темна тема Home Assistant у стилі дашборду «Головна v2».
# https://github.com/haievyio/ha-moi-dim-theme
# Лише темний варіант (навмисно). Шрифт Inter, якщо він є в системі; інакше системний.
#   --g-page #151817  --g-scene #1b201e  --g-card #222725  --g-field #2a2e2b  --g-ctl #2d3430  --g-ctl-hover #363e39
#   --g-accent #b7e6ce  --g-accent-bg #293f33  --g-warn #e9bf80  --g-warn-bg #40372b  --g-ink-dark #183024  --g-live #22c55e
#   --g-text #f3f6f3  --g-text-2 #a6b3ab  --g-text-3 #78877e  --g-line #343d37  --g-sw-off #3a423d
"Мій дім":
  # ---- font ----
  ha-font-family-body: 'Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"'
  ha-font-family-heading: 'var(--ha-font-family-body)'
  primary-font-family: 'var(--ha-font-family-body)'
  paper-font-common-base_-_font-family: 'var(--ha-font-family-body)'
  paper-font-body1_-_font-family: 'var(--ha-font-family-body)'
  mdc-typography-font-family: 'var(--ha-font-family-body)'

  # ---- layout: the sections-view grid golovna-v2 was built on (same values as before, so its layout does not move) ----
  ha-view-sections-column-gap: '17px'
  ha-view-sections-column-min-width: '320px'

  # ---- surfaces ----
  primary-background-color: '#151817'
  secondary-background-color: '#1b201e'
  lovelace-background: '#151817'
  card-background-color: '#222725'
  ha-card-background: '#222725'
  ha-card-border-radius: '22px'
  ha-card-border-width: '0px'
  ha-card-border-color: '#343d37'
  ha-card-box-shadow: 'none'
  clear-background-color: '#151817'
  markdown-code-background-color: '#1b201e'
  code-editor-background-color: '#1b201e'
  table-row-background-color: '#222725'
  table-row-alternative-background-color: '#262c29'
  data-table-background-color: '#222725'

  # ---- text and lines ----
  primary-text-color: '#f3f6f3'
  secondary-text-color: '#a6b3ab'
  disabled-text-color: '#78877e'
  text-primary-color: '#183024'
  text-light-primary-color: '#f3f6f3'
  divider-color: '#343d37'
  outline-color: '#343d37'

  # ---- brand / states ----
  primary-color: '#b7e6ce'
  dark-primary-color: '#8fcfb0'
  light-primary-color: '#293f33'
  accent-color: '#b7e6ce'
  state-icon-color: '#a6b3ab'
  state-active-color: '#b7e6ce'
  state-inactive-color: '#78877e'
  state-on-color: '#b7e6ce'
  state-off-color: '#78877e'
  state-unavailable-color: '#78877e'
  state-light-active-color: '#e9bf80'
  state-switch-active-color: '#b7e6ce'
  state-climate-cool-color: '#8fc3e8'
  state-climate-heat-color: '#e9bf80'
  success-color: '#22c55e'
  warning-color: '#e9bf80'
  error-color: '#e5484d'
  info-color: '#8fc3e8'
  rgb-primary-color: '183, 230, 206'
  rgb-accent-color: '183, 230, 206'
  rgb-primary-text-color: '243, 246, 243'
  rgb-secondary-text-color: '166, 179, 171'
  rgb-primary-background-color: '21, 24, 23'
  rgb-card-background-color: '34, 39, 37'
  rgb-text-primary-color: '24, 48, 36'

  # ---- top bar and sidebar ----
  app-header-background-color: '#151817'
  app-header-text-color: '#f3f6f3'
  app-header-edit-background-color: '#293f33'
  app-header-edit-text-color: '#f3f6f3'
  app-theme-color: '#151817'
  sidebar-background-color: '#0d100f'
  sidebar-text-color: '#a6b3ab'
  sidebar-icon-color: '#a6b3ab'
  sidebar-selected-text-color: '#b7e6ce'
  sidebar-selected-icon-color: '#b7e6ce'
  sidebar-menu-button-text-color: '#f3f6f3'
  sidebar-border-color: '#232a26'

  # ---- dialogs (more-info) ----
  ha-dialog-surface-background: '#222725'
  mdc-dialog-scrim-color: 'rgba(0, 0, 0, 0.55)'
  paper-dialog-background-color: '#222725'
  dialog-box-shadow: '0 12px 40px rgba(0, 0, 0, 0.5)'
  more-info-header-background: '#222725'

  # ---- material (mdc / md3) ----
  mdc-theme-primary: '#b7e6ce'
  mdc-theme-on-primary: '#183024'
  mdc-theme-secondary: '#b7e6ce'
  mdc-theme-on-secondary: '#183024'
  mdc-theme-surface: '#222725'
  mdc-theme-on-surface: '#f3f6f3'
  mdc-theme-background: '#151817'
  mdc-theme-text-primary-on-background: '#f3f6f3'
  mdc-theme-text-secondary-on-background: '#a6b3ab'
  mdc-theme-text-icon-on-background: '#a6b3ab'
  mdc-theme-text-disabled-on-light: '#78877e'
  mdc-ripple-color: '#b7e6ce'
  card-background-color-hover: '#2d3430'

  # ---- inputs ----
  input-fill-color: '#2a2e2b'
  input-disabled-fill-color: '#222725'
  input-ink-color: '#f3f6f3'
  input-label-ink-color: '#a6b3ab'
  input-disabled-ink-color: '#78877e'
  input-idle-line-color: '#343d37'
  input-hover-line-color: '#a6b3ab'
  input-dropdown-icon-color: '#a6b3ab'
  mdc-text-field-fill-color: '#2a2e2b'
  mdc-text-field-ink-color: '#f3f6f3'
  mdc-text-field-label-ink-color: '#a6b3ab'
  mdc-text-field-idle-line-color: '#343d37'
  mdc-text-field-hover-line-color: '#a6b3ab'
  mdc-select-fill-color: '#2a2e2b'
  mdc-select-ink-color: '#f3f6f3'
  mdc-select-label-ink-color: '#a6b3ab'
  mdc-select-idle-line-color: '#343d37'
  mdc-select-dropdown-icon-color: '#a6b3ab'

  # ---- HA design tokens (2025+ components: ha-button, ha-switch, chips, tabs) - the primary scale in the --g-accent hue ----
  ha-color-primary-05: '#0b1a13'
  ha-color-primary-10: '#11261c'
  ha-color-primary-20: '#183024'
  ha-color-primary-30: '#213f30'
  ha-color-primary-40: '#2f5a44'
  ha-color-primary-50: '#4f8a6c'
  ha-color-primary-60: '#7ab89a'
  ha-color-primary-70: '#9fd6b4'
  ha-color-primary-80: '#b7e6ce'
  ha-color-primary-90: '#d6f2e4'
  ha-color-primary-95: '#ebf9f2'
  ha-color-fill-primary-loud-resting: '#b7e6ce'
  ha-color-fill-primary-loud-hover: '#c9eedb'
  ha-color-fill-primary-loud-active: '#b7e6ce'
  ha-color-on-primary-loud: '#183024'
  ha-color-fill-primary-normal-resting: '#293f33'
  ha-color-fill-primary-normal-hover: '#31503f'
  ha-color-fill-primary-normal-active: '#293f33'
  ha-color-on-primary-normal: '#b7e6ce'
  ha-color-fill-primary-quiet-resting: '#222f29'
  ha-color-fill-primary-quiet-hover: '#293f33'
  ha-color-fill-primary-quiet-active: '#222f29'
  ha-color-on-primary-quiet: '#b7e6ce'
  ha-color-border-primary-loud: '#b7e6ce'
  ha-color-border-primary-normal: '#4f8a6c'
  ha-color-border-primary-quiet: '#293f33'

  # ---- switches and sliders (the «Головна» switch: accent track, dark knob; off: --g-sw-off track, --g-knob-off knob) ----
  ha-switch-checked-background-color: '#b7e6ce'
  ha-switch-checked-background-color-hover: '#c9eedb'
  ha-switch-checked-border-color: '#b7e6ce'
  ha-switch-checked-border-color-hover: '#c9eedb'
  ha-switch-checked-thumb-background-color: '#183024'
  ha-switch-checked-thumb-background-color-hover: '#183024'
  ha-switch-checked-thumb-border-color: '#183024'
  ha-switch-checked-thumb-border-color-hover: '#183024'
  ha-switch-background-color: '#3a423d'
  ha-switch-background-color-hover: '#434c46'
  ha-switch-border-color: '#3a423d'
  ha-switch-thumb-background-color: '#a6b3ab'
  ha-switch-thumb-background-color-hover: '#b4c0b8'
  ha-switch-thumb-border-color: '#a6b3ab'
  switch-checked-color: '#b7e6ce'
  switch-checked-button-color: '#183024'
  switch-checked-track-color: '#b7e6ce'
  switch-unchecked-color: '#a6b3ab'
  switch-unchecked-button-color: '#a6b3ab'
  switch-unchecked-track-color: '#3a423d'
  paper-slider-knob-color: '#b7e6ce'
  paper-slider-active-color: '#b7e6ce'
  paper-slider-container-color: '#3a423d'
  slider-track-color: '#3a423d'

  # ---- third-party cards on the other dashboards (Mushroom, Bubble) ----
  mush-rgb-state-entity: '183, 230, 206'
  mush-card-primary-color: '#f3f6f3'
  mush-card-secondary-color: '#a6b3ab'
  mush-chip-background: '#2d3430'
  bubble-main-background-color: '#222725'
  bubble-secondary-background-color: '#2d3430'
  bubble-accent-color: '#b7e6ce'
  bubble-border-radius: '22px'
